services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radius -d radius"]
      interval: 5s
      timeout: 3s
      retries: 15
  radius:
    build: ./freeradius
    environment:
      RADIUS_DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
      RADIUS_TEST_SECRET: ${RADIUS_TEST_SECRET:?required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:1812:1812/udp"
      - "127.0.0.1:1813:1813/udp"
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      PGHOST: postgres
      PGDATABASE: radius
      PGUSER: radius
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?required}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
volumes:
  pgdata:
