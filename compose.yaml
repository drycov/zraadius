services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: radius
      POSTGRES_USER: radius
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radius -d radius"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: ./backend
    command: ["sh", "-ec", "alembic upgrade head && python provision_roles.py"]
    environment:
      PGHOST: postgres
      PGDATABASE: radius
      PGUSER: radius
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      ZRADIUS_SECRET_KEY: ${ZRADIUS_SECRET_KEY:?required}
      ZRADIUS_API_DB_PASSWORD: ${ZRADIUS_API_DB_PASSWORD:?required}
      ZRADIUS_RUNTIME_DB_PASSWORD: ${ZRADIUS_RUNTIME_DB_PASSWORD:?required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  radius:
    build: ./freeradius
    environment:
      ZRADIUS_SECRET_KEY: ${ZRADIUS_SECRET_KEY:?required}
      RADIUS_DB_PASSWORD: ${ZRADIUS_RUNTIME_DB_PASSWORD:?required}
      RADIUS_TEST_SECRET: ${RADIUS_TEST_SECRET:?required}
      TZ: UTC
      RADIUS_ENABLE_SQLIPPOOL: ${RADIUS_ENABLE_SQLIPPOOL:-false}
      RADIUS_ENABLE_NAS: ${RADIUS_ENABLE_NAS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${RADIUS_BIND_IP:-127.0.0.1}:1812:1812/udp"
      - "${RADIUS_BIND_IP:-127.0.0.1}:1813:1813/udp"
    healthcheck:
      test: ["CMD-SHELL", "printf 'User-Name = zradius-healthcheck-invalid\\nUser-Password = invalid\\nMessage-Authenticator = 0x00\\n' | radclient -r 1 -t 2 127.0.0.1:1812 auth \"$RADIUS_TEST_SECRET\" 2>&1 | grep -q 'Access-Reject'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 150s
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      PGHOST: postgres
      PGDATABASE: radius
      ZRADIUS_SECRET_KEY: ${ZRADIUS_SECRET_KEY:?required}
      PGUSER: zradius_api
      PGPASSWORD: ${ZRADIUS_API_DB_PASSWORD:?required}
      RADIUS_ENABLE_SQLIPPOOL: ${RADIUS_ENABLE_SQLIPPOOL:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ZRADIUS_LEGACY_TOKEN_ENABLED: ${ZRADIUS_LEGACY_TOKEN_ENABLED:-false}
      COA_ENABLED: ${COA_ENABLED:-false}
      COA_ALLOWED_NETWORKS: ${COA_ALLOWED_NETWORKS:-}
      ZRADIUS_LDAP_ENABLED: ${ZRADIUS_LDAP_ENABLED:-false}
      ZRADIUS_LDAP_ALLOWED_HOSTS: ${ZRADIUS_LDAP_ALLOWED_HOSTS:-}
      ZRADIUS_LDAP_FAILOVER_MAP: ${ZRADIUS_LDAP_FAILOVER_MAP:-}
      ZRADIUS_LDAP_CA_FILE: ${ZRADIUS_LDAP_CA_FILE:-}
      ZRADIUS_LDAP_HOST: ${ZRADIUS_LDAP_HOST:-}
      ZRADIUS_LDAP_BASE_DN: ${ZRADIUS_LDAP_BASE_DN:-}
      ZRADIUS_LDAP_BIND_DN: ${ZRADIUS_LDAP_BIND_DN:-}
      ZRADIUS_LDAP_BIND_PASSWORD: ${ZRADIUS_LDAP_BIND_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    restart: unless-stopped
  directory-worker:
    profiles: [directory-sync]
    command: ["python", "directory_worker.py"]
    build: ./backend
    environment:
      ZRADIUS_DIRECTORY_SYNC_INTERVAL: ${ZRADIUS_DIRECTORY_SYNC_INTERVAL:-900}
      PGHOST: postgres
      PGDATABASE: radius
      ZRADIUS_SECRET_KEY: ${ZRADIUS_SECRET_KEY:?required}
      PGUSER: zradius_api
      PGPASSWORD: ${ZRADIUS_API_DB_PASSWORD:?required}
      RADIUS_ENABLE_SQLIPPOOL: ${RADIUS_ENABLE_SQLIPPOOL:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ZRADIUS_LEGACY_TOKEN_ENABLED: ${ZRADIUS_LEGACY_TOKEN_ENABLED:-false}
      COA_ENABLED: ${COA_ENABLED:-false}
      COA_ALLOWED_NETWORKS: ${COA_ALLOWED_NETWORKS:-}
      ZRADIUS_LDAP_ENABLED: ${ZRADIUS_LDAP_ENABLED:-false}
      ZRADIUS_LDAP_ALLOWED_HOSTS: ${ZRADIUS_LDAP_ALLOWED_HOSTS:-}
      ZRADIUS_LDAP_FAILOVER_MAP: ${ZRADIUS_LDAP_FAILOVER_MAP:-}
      ZRADIUS_LDAP_CA_FILE: ${ZRADIUS_LDAP_CA_FILE:-}
      ZRADIUS_LDAP_HOST: ${ZRADIUS_LDAP_HOST:-}
      ZRADIUS_LDAP_BASE_DN: ${ZRADIUS_LDAP_BASE_DN:-}
      ZRADIUS_LDAP_BIND_DN: ${ZRADIUS_LDAP_BIND_DN:-}
      ZRADIUS_LDAP_BIND_PASSWORD: ${ZRADIUS_LDAP_BIND_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
volumes:
  pgdata:
