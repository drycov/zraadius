name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Install browser for UI tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: UI smoke tests (mock API)
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall backend scripts
      - name: Validate shell syntax
        run: |
          for f in freeradius/*.sh scripts/*.sh; do sh -n "$f"; done
      - name: Import API and generate OpenAPI
        working-directory: backend
        run: python -c 'from main import app; assert app.openapi()["paths"]'
      - run: python -m unittest test_ipam test_ipoe test_hotspot test_secret_crypto test_iam test_mfa test_service_tokens test_ppp_vpn test_ppp_import test_routeros_ppp
        working-directory: backend
      - run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build
      - name: Start isolated AAA stack
        run: |
          printf 'POSTGRES_PASSWORD=%s\nADMIN_TOKEN=%s\nRADIUS_TEST_SECRET=%s\nZRADIUS_API_DB_PASSWORD=%s\nZRADIUS_RUNTIME_DB_PASSWORD=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
          printf 'ZRADIUS_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'ZRADIUS_LEGACY_TOKEN_ENABLED=true\n' >> .env
          docker compose up -d
          python scripts/wait-radius.py
          docker compose run --rm migrate
          docker compose exec -T api alembic current
          docker compose exec -T api python check_db_roles.py
      - name: AAA integration
        run: |
          set -a
          . ./.env
          set +a
          python scripts/integration-radius.py
          ZRADIUS_ISOLATED_TEST=1 python scripts/integration-identity.py
      - name: Service diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100
      - name: Remove isolated CI stack
        if: always()
        run: docker compose down -v
