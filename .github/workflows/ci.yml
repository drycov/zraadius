name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall backend
      - run: python -m unittest test_ipam test_ipoe
        working-directory: backend
      - run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build
      - name: Start isolated AAA stack
        run: |
          printf 'POSTGRES_PASSWORD=%s\nADMIN_TOKEN=%s\nRADIUS_TEST_SECRET=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
          docker compose up -d
          for i in $(seq 1 60); do
            if docker compose exec -T radius sh -c 'test -s /run/freeradius/freeradius.pid' 2>/dev/null; then break; fi
            sleep 2
          done
      - name: AAA integration
        run: |
          set -a
          . ./.env
          set +a
          python scripts/integration-radius.py
      - name: Service diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100
      - name: Remove isolated CI stack
        if: always()
        run: docker compose down -v
