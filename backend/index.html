<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ZRADIUS</title><style>
body{font:15px system-ui;background:#0f172a;color:#e2e8f0;margin:0}header{padding:24px;border-bottom:1px solid #334155}main{max-width:1000px;margin:auto;padding:24px}section{background:#1e293b;padding:24px;border-radius:8px;margin:16px 0}input,button{font:inherit;padding:10px;margin:4px;border:1px solid #475569;border-radius:5px}input{background:#0f172a;color:white}button{background:#2563eb;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style><header><strong>ZRADIUS</strong> / AAA Management / Alpha</header><main><section><h2>Management access</h2><input id="token" type="password" placeholder="Admin token" autocomplete="off"><button id="refresh">Обновить</button></section><section><h2>Пользователи RADIUS</h2><form id="user"><input name="username" required placeholder="Username"><input name="password" type="password" required minlength="12" placeholder="Password"><button>Создать</button></form><pre id="users"></pre></section><section><h2>Группы</h2><form id="group"><input name="name" required placeholder="Group name"><button>Создать</button></form><pre id="groups"></pre></section><section><h2>Аудит</h2><pre id="audit"></pre></section><p id="status" role="status"></p></main><script>
const el=id=>document.getElementById(id);
async function request(path,method='GET',body){const r=await fetch('/api/v1/'+path,{method,headers:{Authorization:'Bearer '+el('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
async function refresh(){try{for(const p of ['users','groups','audit'])el(p).textContent=JSON.stringify(await request(p),null,2);el('status').textContent='Данные обновлены'}catch(e){el('status').textContent=e.message}}
el('refresh').onclick=refresh;
for(const [form,path] of [['user','users'],['group','groups']])el(form).onsubmit=async e=>{e.preventDefault();try{await request(path,'POST',Object.fromEntries(new FormData(e.target)));e.target.reset();await refresh()}catch(err){el('status').textContent=err.message}};
</script></html>
